spring.application.name=xiaozhi-learning
server.port=8081

spring.data.mongodb.uri=mongodb://127.0.0.1:27017/xiaozhi_learning

# MySQL: password comes from the environment, not from Git.
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/xiaozhi_learning?sslMode=REQUIRED&characterEncoding=UTF-8&connectionTimeZone=Asia/Shanghai&connectTimeout=5000&socketTimeout=10000
spring.datasource.username=${MYSQL_USERNAME:xiaozhi_app}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000

# Tables will be created explicitly in the next stage.
spring.sql.init.mode=never
mybatis-plus.configuration.map-underscore-to-camel-case=true

# Run one read-only query at startup to verify the Mapper connection.
xiaozhi.mysql.verify-on-startup=true
# Local account session. Set APP_COOKIE_SECURE=true for future HTTPS deployment.
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${APP_COOKIE_SECURE:false}
# DashScope SDK network limits (seconds). Read is an idle timeout, not a total deadline.
# Applied before SDK clients initialize; affects chat and embeddings in this JVM.
xiaozhi.ai.network.connect-timeout-seconds=10
xiaozhi.ai.network.read-timeout-seconds=60
xiaozhi.ai.network.write-timeout-seconds=20
