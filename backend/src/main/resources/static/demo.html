<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>小智 · 医疗导诊演示</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #f3f6fb;
            color: #334155;
            font-family: "Microsoft YaHei", system-ui, sans-serif;
        }
        main {
            max-width: 1380px;
            margin: 28px auto;
            padding: 0 24px 40px;
        }
        h1 { color: #24364b; margin: 0 0 14px; }
        h2 { color: #24364b; font-size: 22px; margin: 0; }
        h3 { color: #24364b; font-size: 21px; }
        p { line-height: 1.7; }
        .muted { color: #7a8da7; }
        .layout {
            display: grid;
            grid-template-columns: 1.2fr 0.9fr;
            gap: 26px;
            align-items: start;
            margin-top: 26px;
        }
        .card {
            padding: 26px;
            border: 1px solid #e1e9f3;
            border-radius: 22px;
            background: white;
            box-shadow: 0 10px 30px #33415508;
        }
        .card-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 18px;
        }
        #messages {
            height: 410px;
            overflow-y: auto;
            margin-bottom: 20px;
        }
        .message {
            border-radius: 14px;
            padding: 15px;
            margin-bottom: 12px;
        }
        .message.assistant { background: #f0f4fa; }
        .message.user { background: #e8f0ff; }
        .message-label {
            font-size: 13px;
            font-weight: bold;
            color: #6c809b;
            margin-bottom: 8px;
        }
        .message-body {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            line-height: 1.8;
        }
        label { display: block; margin-bottom: 8px; }
        textarea, input {
            width: 100%;
            border: 1px solid #d6e1ef;
            border-radius: 12px;
            padding: 13px;
            font: inherit;
            color: inherit;
            background: white;
        }
        textarea { resize: vertical; min-height: 115px; }
        button {
            border: 0;
            border-radius: 11px;
            padding: 13px 16px;
            cursor: pointer;
            font: inherit;
            color: white;
            background: #2563d9;
        }
        button:disabled { opacity: .5; cursor: not-allowed; }
        button.secondary { background: #edf3fb; color: #557aa5; }
        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 14px;
        }
        #status { color: #557aa5; min-height: 24px; }
        #status.error { color: #b42318; }
        .small { font-size: 13px; line-height: 1.7; }
        #operationNotice { color: #996c23; }
        #draftChoices {
            display: grid;
            gap: 9px;
            max-height: 240px;
            overflow-y: auto;
        }
        .draft-choice {
            text-align: left;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            line-height: 1.7;
            color: #526b8b;
            background: #f4f7fc;
            border: 1px solid #e0e8f4;
        }
        .draft-choice.selected {
            color: #2056aa;
            background: #eaf1ff;
            border-color: #6493ff;
        }
        .detail-row {
            padding: 14px 0;
            border-bottom: 1px solid #eef2f7;
        }
        .detail-label {
            color: #7a8da7;
            font-size: 13px;
            margin-bottom: 7px;
        }
        .detail-value { overflow-wrap: anywhere; line-height: 1.7; }
        .notice {
            margin: 20px 0 15px;
            padding: 15px;
            border: 1px solid #f5e0b9;
            border-radius: 11px;
            color: #997431;
            background: #fff8eb;
            line-height: 1.7;
        }
        #confirmButton { width: 100%; }
        #draftForm { margin-top: 24px; padding-top: 22px; border-top: 1px solid #eef2f7; }
        @media (max-width: 850px) {
            .layout { grid-template-columns: 1fr; }
            main { padding: 0 14px 30px; }
            .card { padding: 20px; }
        }
    </style>
</head>
<body>
<main>
    <h1>小智 · 医疗导诊演示</h1>
    <p class="muted">
        当前支持：虚构医院 DEMO001 · 内科 · 上海时区。
        仅用于学习，不连接真实医院号源。
    </p>

    <div class="layout">
        <section class="card">
            <div class="card-heading">
                <h2>与小智交流</h2>
                <button id="newChatButton" class="secondary" type="button">新会话</button>
            </div>

            <div id="messages" aria-live="polite"></div>

            <form id="chatForm">
                <label for="messageInput">你的消息</label>
                <textarea id="messageInput" maxlength="2000"
                          placeholder="例如：我想了解演示预约流程。"></textarea>
                <div class="actions">
                    <button id="sendButton" type="submit">发送消息</button>
                    <button id="exampleButton" class="secondary" type="button">
                        填入演示预约请求
                    </button>
                </div>
            </form>

            <p id="status" role="status"></p>
            <p id="storageNotice" class="small muted"></p>
            <p id="operationNotice" class="small" role="status"></p>
        </section>

        <section class="card">
            <div class="card-heading">
                <h2>草稿列表</h2>
                <span class="muted">共 <span id="draftCount">0</span> 份</span>
            </div>

            <p class="muted">
                刷新本标签页可恢复列表，并重新查询草稿状态。
                点击“新会话”会清空本页暂存，数据库记录仍保留。
            </p>

            <div id="draftChoices"></div>

            <h3>当前草稿详情</h3>
            <p id="draftHint" class="muted"></p>
            <div id="draftDetails"></div>

            <div id="confirmationNotice" class="notice"></div>
            <button id="confirmButton" type="button" disabled>确认创建演示预约</button>

            <form id="draftForm">
                <label for="draftIdInput">手动加载已有草稿</label>
                <input id="draftIdInput" placeholder="DRAFT-..." autocomplete="off">
                <div class="actions">
                    <button id="loadButton" class="secondary" type="submit">
                        加载 / 刷新草稿
                    </button>
                </div>
            </form>
        </section>
    </div>
</main>

<script>
    const $ = id => document.getElementById(id);
    const draftIdPattern = /^DRAFT-[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$/;
    const storageKey = "xiaozhi.demo.session.v1";

    let conversationId = crypto.randomUUID();
    const drafts = new Map();
    let selectedDraftId = null;
    let currentDraft = null;
    let busy = false;
    let history = [];
    let pendingOperation = "";

    function saveSession() {
        try {
            sessionStorage.setItem(storageKey, JSON.stringify({
                version: 1,
                conversationId,
                draftIds: [...drafts.keys()],
                selectedDraftId,
                history: history.slice(-100),
                pendingOperation
            }));
            $("storageNotice").textContent =
                "本标签页会暂存最近 100 条消息和草稿编号。";
        } catch (error) {
            $("storageNotice").textContent =
                "浏览器暂存失败；当前页面仍可使用，但刷新后可能无法恢复。";
        }
    }

    function showOperationNotice() {
        $("operationNotice").textContent = pendingOperation
            ? "有一次" + pendingOperation +
            "尚未核实结果。后端可能已处理，请先核对；页面不会自动重发。"
            : "";
    }

    function setStatus(text, error = false) {
        $("status").textContent = text;
        $("status").classList.toggle("error", error);
    }

    function updateControls() {
        for (const id of ["sendButton", "newChatButton", "exampleButton", "loadButton"]) {
            $(id).disabled = busy;
        }
        for (const button of $("draftChoices").querySelectorAll("button")) {
            button.disabled = busy;
        }
        $("messageInput").disabled = busy;
        $("draftIdInput").disabled = busy;
        $("confirmButton").disabled = busy || !currentDraft ||
            currentDraft.status !== "PENDING_CONFIRMATION" ||
            currentDraft.appointmentId != null;
    }

    function setBusy(value) {
        busy = value;
        updateControls();
    }

    function addMessage(role, text, remember = true) {
        const box = document.createElement("div");
        box.className = "message " + role;

        const label = document.createElement("div");
        label.className = "message-label";
        label.textContent = role === "user" ? "你" : "小智";

        const body = document.createElement("div");
        body.className = "message-body";
        body.textContent = text;

        box.append(label, body);
        $("messages").append(box);
        $("messages").scrollTop = $("messages").scrollHeight;

        if (remember) {
            history.push({role, text});
            history = history.slice(-100);
            saveSession();
        }
    }

    function validateDraft(draft) {
        if (!draft || typeof draft.draftId !== "string" ||
            !draftIdPattern.test(draft.draftId) ||
            !["PENDING_CONFIRMATION", "CONFIRMED"].includes(draft.status)) {
            throw new Error("草稿数据格式异常。");
        }
    }

    function renderChoices() {
        $("draftChoices").replaceChildren();
        $("draftCount").textContent = String(drafts.size);

        for (const draft of [...drafts.values()].reverse()) {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "draft-choice";
            button.classList.toggle("selected", draft.draftId === selectedDraftId);
            button.setAttribute("aria-pressed", String(draft.draftId === selectedDraftId));

            const state = draft.status === "CONFIRMED" ? "已确认"
                : draft.status === "PENDING_CONFIRMATION" ? "待确认" : "状态未核实";

            button.textContent =
                (draft.visitDate || "日期待查询") + " · " +
                (draft.department || "科室待查询") + " · " + state +
                "\n" + draft.draftId;

            button.addEventListener("click", () => selectDraft(draft.draftId));
            $("draftChoices").append(button);
        }

        updateControls();
    }

    function showUnavailable(hint) {
        currentDraft = null;
        $("draftDetails").replaceChildren();
        $("draftHint").textContent = hint;
        $("confirmButton").textContent = "确认创建演示预约";
        $("confirmationNotice").textContent = "请先加载并核对草稿详情，再确认。";
        updateControls();
    }

    function addDetail(label, value) {
        const row = document.createElement("div");
        row.className = "detail-row";

        const title = document.createElement("div");
        title.className = "detail-label";
        title.textContent = label;

        const content = document.createElement("div");
        content.className = "detail-value";
        content.textContent = value == null ? "尚未生成" : String(value);

        row.append(title, content);
        $("draftDetails").append(row);
    }

    function displayDraft(draft) {
        validateDraft(draft);
        drafts.set(draft.draftId, draft);
        selectedDraftId = draft.draftId;
        currentDraft = draft;
        $("draftIdInput").value = draft.draftId;
        $("draftDetails").replaceChildren();

        const confirmed = draft.status === "CONFIRMED";
        $("draftHint").textContent = confirmed
            ? "当前草稿已确认。"
            : "请核对当前草稿，再决定是否确认。";

        addDetail("草稿编号", draft.draftId);
        addDetail("状态", confirmed ? "已确认" : "待确认");
        addDetail("医院编号（演示）", draft.hospitalId);
        addDetail("科室", draft.department);
        addDetail("预约日期", draft.visitDate);
        addDetail("时区", draft.timeZone);
        addDetail("预约编号", draft.appointmentId);
        addDetail("说明", draft.message);

        $("confirmButton").textContent = confirmed
            ? "已创建演示预约"
            : "确认创建演示预约";

        $("confirmationNotice").textContent = confirmed
            ? "本地演示预约已创建，不代表真实医院挂号成功。"
            : "按钮只确认当前展示的草稿。聊天中的“确认”不会创建预约。";

        renderChoices();
        saveSession();
    }

    async function request(url, options = {}) {
        const response = await fetch(url, {...options, cache: "no-store"});
        if (!response.ok) {
            throw new Error("请求失败，HTTP 状态码：" + response.status);
        }
        return response.json();
    }

    async function fetchDraft(draftId) {
        if (!draftIdPattern.test(draftId)) {
            throw new Error("请提供完整的 DRAFT-... 编号。");
        }

        const draft = await request(
            "/api/appointments/drafts/" + encodeURIComponent(draftId)
        );

        if (draft.draftId !== draftId) {
            throw new Error("返回的草稿编号不一致。");
        }

        validateDraft(draft);
        return draft;
    }

    async function refreshDraft(draftId) {
        displayDraft(await fetchDraft(draftId));
    }

    async function selectDraft(draftId) {
        if (busy) return;
        setBusy(true);

        if (drafts.has(draftId)) selectedDraftId = draftId;
        renderChoices();
        saveSession();
        showUnavailable("正在从后端读取草稿……");
        setStatus("正在查询……");

        try {
            await refreshDraft(draftId);
            setStatus("草稿已刷新。");
        } catch (error) {
            showUnavailable("查询失败，草稿列表已保留，请重新选择后再确认。");
            setStatus(error.message, true);
        } finally {
            saveSession();
            showOperationNotice();
            setBusy(false);
        }
    }

    function tomorrowInShanghai() {
        const parts = new Intl.DateTimeFormat("en-US", {
            timeZone: "Asia/Shanghai",
            year: "numeric",
            month: "2-digit",
            day: "2-digit"
        }).formatToParts(new Date());

        const value = type => parts.find(part => part.type === type).value;

        return new Date(Date.UTC(
            Number(value("year")),
            Number(value("month")) - 1,
            Number(value("day")) + 1
        )).toISOString().slice(0, 10);
    }

    $("exampleButton").addEventListener("click", () => {
        $("messageInput").value =
            "我选择 DEMO001 的内科，预约日期是 " +
            tomorrowInShanghai() + "。请帮我生成一份演示预约草稿。";
        $("messageInput").focus();
        setStatus("已填入示例，请核对日期后发送。");
    });

    $("chatForm").addEventListener("submit", async event => {
        event.preventDefault();
        if (busy) return;

        const message = $("messageInput").value.trim();
        if (!message) return;

        addMessage("user", message);
        $("messageInput").value = "";
        setBusy(true);
        setStatus("小智正在回复，请稍候……");
        pendingOperation = "聊天请求";
        saveSession();

        try {
            const data = await request("/api/chat", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({conversationId, message})
            });

            if (typeof data.reply !== "string" || !Array.isArray(data.drafts)) {
                throw new Error("聊天接口返回格式异常。");
            }

            addMessage("assistant", data.reply);
            data.drafts.forEach(validateDraft);

            const newDrafts = [
                ...new Map(data.drafts.map(draft => [draft.draftId, draft])).values()
            ];

            newDrafts.forEach(draft => drafts.set(draft.draftId, draft));
            renderChoices();
            saveSession();

            if (newDrafts.length === 1) {
                displayDraft(newDrafts[0]);
            } else if (newDrafts.length > 1) {
                selectedDraftId = null;
                showUnavailable("本轮生成了多份草稿，请从列表中选择一份。");
                renderChoices();
            } else if (selectedDraftId) {
                await refreshDraft(selectedDraftId);
            } else {
                showUnavailable(drafts.size
                    ? "请从列表中选择草稿。"
                    : "当前还没有草稿。");
            }

            pendingOperation = "";
            setStatus(newDrafts.length
                ? "回复完成，草稿已加入列表。"
                : "回复完成，已有草稿已保留。");
        } catch (error) {
            showUnavailable("本轮结果未完整取得。已有列表保留，请重新选择草稿核实状态。");
            setStatus(error.message + "。请求不会自动重发。", true);
        } finally {
            saveSession();
            showOperationNotice();
            setBusy(false);
        }
    });

    $("draftForm").addEventListener("submit", event => {
        event.preventDefault();
        selectDraft($("draftIdInput").value.trim());
    });

    $("confirmButton").addEventListener("click", async () => {
        if (busy || !currentDraft ||
            currentDraft.status !== "PENDING_CONFIRMATION" ||
            currentDraft.appointmentId != null) return;

        const draftId = currentDraft.draftId;
        setBusy(true);
        setStatus("正在确认当前展示的草稿……");
        pendingOperation = "预约确认请求";
        saveSession();

        try {
            const appointment = await request(
                "/api/appointments/drafts/" +
                encodeURIComponent(draftId) + "/confirm",
                {method: "POST"}
            );

            if (appointment.status !== "DEMO_CREATED" || !appointment.appointmentId) {
                throw new Error("确认接口返回内容异常。");
            }

            await refreshDraft(draftId);

            if (currentDraft.status !== "CONFIRMED" ||
                currentDraft.appointmentId !== appointment.appointmentId) {
                throw new Error("确认结果与草稿查询结果不一致。");
            }

            pendingOperation = "";
            setStatus("演示预约已创建，列表状态已更新。");
        } catch (error) {
            showUnavailable("确认结果尚未核实，请点击列表中的同一份草稿重新查询。");
            setStatus(error.message + "。请勿另建草稿来重试此次确认。", true);
        } finally {
            saveSession();
            showOperationNotice();
            setBusy(false);
        }
    });

    $("newChatButton").addEventListener("click", () => {
        if (busy) return;

        conversationId = crypto.randomUUID();
        drafts.clear();
        history = [];
        pendingOperation = "";
        showOperationNotice();
        selectedDraftId = null;

        $("messages").replaceChildren();
        $("messageInput").value = "";
        $("draftIdInput").value = "";

        showUnavailable("新会话已开始。旧草稿和预约仍保留在数据库中。");
        renderChoices();
        setStatus("");

        addMessage("assistant",
            "你好，我是小智。可以交流需求，也可以准备演示预约草稿。");
    });

    async function restoreSession() {
        setBusy(true);
        showUnavailable("正在恢复当前标签页……");
        let saved = null;

        try {
            const raw = sessionStorage.getItem(storageKey);

            if (raw) {
                const value = JSON.parse(raw);

                if (value.version !== 1 ||
                    typeof value.conversationId !== "string" ||
                    !/^[0-9a-f-]{36}$/i.test(value.conversationId) ||
                    !Array.isArray(value.draftIds) ||
                    !value.draftIds.every(id =>
                        typeof id === "string" && draftIdPattern.test(id)) ||
                    !Array.isArray(value.history) ||
                    !value.history.every(item =>
                        item &&
                        ["user", "assistant"].includes(item.role) &&
                        typeof item.text === "string")) {
                    throw new Error("暂存内容无效");
                }

                saved = value;
            }
        } catch (error) {
            $("storageNotice").textContent =
                "未能读取旧暂存，已开始新会话。数据库记录仍保留。";
        }

        if (!saved) {
            renderChoices();
            showUnavailable("生成草稿后，可在列表中切换查看。");
            addMessage("assistant",
                "你好，我是小智。可以交流需求，也可以点击“填入演示预约请求”。");
            setBusy(false);
            return;
        }

        conversationId = saved.conversationId;
        history = saved.history.slice(-100);
        history.forEach(item => addMessage(item.role, item.text, false));

        pendingOperation = typeof saved.pendingOperation === "string"
            ? saved.pendingOperation : "";
        showOperationNotice();

        const ids = [...new Set(saved.draftIds)];
        ids.forEach(draftId =>
            drafts.set(draftId, {draftId, status: "UNVERIFIED"}));

        selectedDraftId = ids.includes(saved.selectedDraftId)
            ? saved.selectedDraftId : null;

        renderChoices();
        setStatus("正在向后端核实草稿状态……");

        const results = await Promise.allSettled(ids.map(fetchDraft));
        let failures = 0;

        results.forEach((result, index) => {
            if (result.status === "fulfilled") {
                drafts.set(ids[index], result.value);
            } else {
                failures++;
            }
        });

        const selected = drafts.get(selectedDraftId);

        if (selected && selected.status !== "UNVERIFIED") {
            displayDraft(selected);
        } else {
            showUnavailable(selectedDraftId
                ? "当前草稿查询失败，请点击列表重试；核实前不能确认。"
                : drafts.size
                    ? "请从恢复的列表中选择草稿。"
                    : "当前还没有草稿。");
        }

        renderChoices();
        saveSession();

        setStatus(failures
                ? "会话已恢复，有 " + failures + " 份草稿未能核实，请点击重试。"
                : "会话已恢复，草稿状态已从后端更新。",
            failures > 0);

        setBusy(false);
    }

    restoreSession();
</script>
</body>
</html>
