<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>小智 · 医疗导诊演示</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #f3f6fb;
            color: #334155;
            font-family: "Microsoft YaHei", system-ui, sans-serif;
        }
        main {
            max-width: 1380px;
            margin: 28px auto;
            padding: 0 24px 40px;
        }
        h1 { color: #24364b; margin: 0 0 14px; }
        h2 { color: #24364b; font-size: 22px; margin: 0; }
        h3 { color: #24364b; font-size: 21px; }
        p { line-height: 1.7; }
        .muted { color: #7a8da7; }
        .layout {
            display: grid;
            grid-template-columns: 1.2fr 0.9fr;
            gap: 26px;
            align-items: start;
            margin-top: 26px;
        }
        .card {
            padding: 26px;
            border: 1px solid #e1e9f3;
            border-radius: 22px;
            background: white;
            box-shadow: 0 10px 30px #33415508;
        }
        .card-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 18px;
        }
        #messages {
            height: 410px;
            overflow-y: auto;
            margin-bottom: 20px;
        }
        .message {
            border-radius: 14px;
            padding: 15px;
            margin-bottom: 12px;
        }
        .message.assistant { background: #f0f4fa; }
        .message.user { background: #e8f0ff; }
        .message-label {
            font-size: 13px;
            font-weight: bold;
            color: #6c809b;
            margin-bottom: 8px;
        }
        .message-body {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            line-height: 1.8;
        }
        .source-panel { margin-top: 12px; }
        .source-note { margin: 10px 0; color: #526b8b; }
        .source-item {
            margin: 10px 0;
            padding: 10px;
            background: #fff;
            border-radius: 8px;
        }
        .source-label {
            font-weight: bold;
            overflow-wrap: anywhere;
        }
        .source-text {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            line-height: 1.7;
            margin: 8px 0 0;
        }
        summary:focus-visible {
            outline: 3px solid #93b4ff;
            outline-offset: 2px;
        }
        label { display: block; margin-bottom: 8px; }
        textarea, input {
            width: 100%;
            border: 1px solid #d6e1ef;
            border-radius: 12px;
            padding: 13px;
            font: inherit;
            color: inherit;
            background: white;
        }
        textarea { resize: vertical; min-height: 115px; }
        button {
            border: 0;
            border-radius: 11px;
            padding: 13px 16px;
            cursor: pointer;
            font: inherit;
            color: white;
            background: #2563d9;
        }
        button:disabled { opacity: .5; cursor: not-allowed; }
        button.secondary { background: #edf3fb; color: #557aa5; }
        button.danger { background: #fff0ee; color: #b42318; }
        button:focus-visible,
        input:focus-visible,
        textarea:focus-visible {
            outline: 3px solid #93b4ff;
            outline-offset: 2px;
        }
        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 14px;
        }
        #status { color: #557aa5; min-height: 24px; }
        #status.error { color: #b42318; }
        .small { font-size: 13px; line-height: 1.7; }
        #operationNotice { color: #996c23; }
        #draftChoices {
            display: grid;
            gap: 9px;
            max-height: 260px;
            overflow-y: auto;
            margin-top: 16px;
        }
        .draft-choice {
            text-align: left;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            line-height: 1.7;
            color: #526b8b;
            background: #f4f7fc;
            border: 1px solid #e0e8f4;
        }
        .draft-choice.selected {
            color: #2056aa;
            background: #eaf1ff;
            border-color: #6493ff;
        }
        .detail-row {
            padding: 14px 0;
            border-bottom: 1px solid #eef2f7;
        }
        .detail-label {
            color: #7a8da7;
            font-size: 13px;
            margin-bottom: 7px;
        }
        .detail-value {
            overflow-wrap: anywhere;
            line-height: 1.7;
        }
        .notice {
            margin: 20px 0 15px;
            padding: 15px;
            border: 1px solid #f5e0b9;
            border-radius: 11px;
            color: #997431;
            background: #fff8eb;
            line-height: 1.7;
        }
        .draft-actions {
            display: grid;
            gap: 10px;
        }
        .draft-actions button { width: 100%; }
        #draftForm {
            margin-top: 24px;
            padding-top: 22px;
            border-top: 1px solid #eef2f7;
        }
        details {
            margin-top: 18px;
            border-top: 1px solid #eef2f7;
            padding-top: 14px;
        }
        summary { cursor: pointer; color: #6c809b; }
        details label { margin-top: 14px; }
        @media (max-width: 850px) {
            .layout { grid-template-columns: 1fr; }
            main { padding: 0 14px 30px; }
            .card { padding: 20px; }
        }
    </style>
</head>
<body>
<main>
    <h1>小智 · 医疗导诊演示</h1>
    <p class="muted">
        当前支持：虚构医院 DEMO001 · 内科 · 上海时区。
        仅用于学习，不连接真实医院号源。
    </p>

    <div class="layout">
        <section class="card">
            <div class="card-heading">
                <h2>与小智交流</h2>
                <button id="newChatButton" class="secondary" type="button">
                    新会话
                </button>
            </div>

            <div id="messages" aria-live="polite"></div>

            <form id="chatForm">
                <label for="messageInput">你的消息</label>
                <textarea id="messageInput" maxlength="2000"
                          placeholder="例如：我想了解演示预约流程。"></textarea>
                <div class="actions">
                    <button id="sendButton" type="submit">发送消息</button>
                    <button id="exampleButton" class="secondary" type="button">
                        填入演示预约请求
                    </button>
                </div>
            </form>

            <p id="status" role="status"></p>
            <p id="storageNotice" class="small muted"></p>
            <p id="operationNotice" class="small" role="status"></p>

            <details>
                <summary>会话信息（排查用）</summary>
                <label for="conversationIdView">当前会话编号</label>
                <input id="conversationIdView" readonly>
                <p class="small muted">
                    点击“新会话”会更换编号。此编号用于关联会话，并非登录凭证。
                </p>
            </details>
        </section>

        <section class="card">
            <div class="card-heading">
                <h2>草稿列表</h2>
                <span class="muted">
                    共 <span id="draftCount">0</span> 份
                </span>
            </div>

            <p class="muted">
                刷新时自动查询当前会话最近的 100 份草稿。
                手动加载的草稿也会保留在本页列表中。
            </p>

            <button id="syncButton" class="secondary" type="button">
                同步当前会话草稿
            </button>

            <p class="small muted">
                如果聊天中途刷新，可稍后点击同步找回已生成的草稿。
                同步只查询，不会创建、确认或取消草稿。
            </p>

            <div id="draftChoices"></div>

            <h3>当前草稿详情</h3>
            <p id="draftHint" class="muted"></p>
            <div id="draftDetails"></div>

            <div id="confirmationNotice" class="notice"></div>

            <div class="draft-actions">
                <button id="confirmButton" type="button" disabled>
                    确认创建演示预约
                </button>
                <button id="cancelButton" class="danger" type="button" disabled>
                    取消当前草稿
                </button>
            </div>

            <form id="draftForm">
                <label for="draftIdInput">手动加载已有草稿</label>
                <input id="draftIdInput" placeholder="请输入完整的 DRAFT-... 编号">
                <div class="actions">
                    <button id="loadButton" class="secondary" type="submit">
                        加载草稿
                    </button>
                </div>
            </form>
        </section>
    </div>
</main>

<script>
    const $ = id => document.getElementById(id);
    const draftIdPattern = /^DRAFT-[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$/;
    const storageKey = "xiaozhi.demo.session.v1";

    let conversationId = crypto.randomUUID();
    const drafts = new Map();
    let selectedDraftId = null;
    let currentDraft = null;
    let busy = false;
    let history = [];
    let pendingOperation = "";
    let pendingDraftId = null;

    const draftStates = {
        PENDING_CONFIRMATION: "待确认",
        CONFIRMING: "确认处理中",
        CONFIRMED: "已确认",
        CANCELLED: "已取消"
    };

    function saveSession() {
        $("conversationIdView").value = conversationId;

        try {
            sessionStorage.setItem(storageKey, JSON.stringify({
                version: 1,
                conversationId,
                draftIds: [...drafts.keys()],
                selectedDraftId,
                history: history.slice(-100),
                pendingOperation,
                pendingDraftId
            }));

            $("storageNotice").textContent =
                "本标签页会暂存最近 100 条消息、对应参考资料和草稿编号。";
        } catch (error) {
            $("storageNotice").textContent =
                "浏览器暂存失败；当前页面仍可使用，但刷新后可能无法恢复。";
        }
    }

    function showOperationNotice() {
        $("operationNotice").textContent = pendingOperation
            ? "有一次" + pendingOperation + "的完整结果尚未核实。" +
            (pendingDraftId ? "对应草稿：" + pendingDraftId + "。" : "") +
            "请同步或加载草稿核对。查询不会补回聊天回复，也不会重发原请求。"
            : "";
    }

    function resolvePendingOperation(draft) {
        if (draft.draftId === pendingDraftId &&
            ["CONFIRMED", "CANCELLED"].includes(draft.status)) {
            pendingOperation = "";
            pendingDraftId = null;
            showOperationNotice();
        }
    }

    function canConfirm(draft) {
        return !!draft &&
            ["PENDING_CONFIRMATION", "CONFIRMING"].includes(draft.status) &&
            draft.appointmentId == null;
    }

    function canCancel(draft) {
        return !!draft &&
            draft.status === "PENDING_CONFIRMATION" &&
            draft.appointmentId == null;
    }

    function setStatus(text, error = false) {
        $("status").textContent = text;
        $("status").classList.toggle("error", error);
    }

    function updateControls() {
        for (const id of [
            "sendButton", "newChatButton", "exampleButton",
            "loadButton", "syncButton"
        ]) {
            $(id).disabled = busy;
        }

        for (const button of $("draftChoices").querySelectorAll("button")) {
            button.disabled = busy;
        }

        $("messageInput").disabled = busy;
        $("draftIdInput").disabled = busy;
        $("confirmButton").disabled = busy || !canConfirm(currentDraft);
        $("cancelButton").disabled = busy || !canCancel(currentDraft);
    }

    function setBusy(value) {
        busy = value;
        updateControls();
    }

    // 兼容旧接口和旧暂存；来源异常不会阻断草稿处理。
    function normalizeSources(value) {
        if (!Array.isArray(value)) return [];

        return value.filter(item => item &&
            typeof item.source === "string" && item.source.trim() &&
            Number.isInteger(item.index) && item.index >= 0 &&
            typeof item.text === "string" && item.text.trim()
        ).map(item => ({
            source: item.source,
            index: item.index,
            text: item.text
        }));
    }

    function appendSources(box, sources) {
        if (!sources.length) return;

        const panel = document.createElement("details");
        panel.className = "source-panel small";

        const heading = document.createElement("summary");
        heading.textContent =
            "本轮检索参考资料（" + sources.length + " 个片段）";

        const note = document.createElement("p");
        note.className = "source-note";
        note.textContent =
            "以下是本轮检索到的虚构教学资料，不代表回答中的每句话都有依据。可展开对照原文；不是医院官方信息。";

        panel.append(heading, note);

        for (const source of sources) {
            const item = document.createElement("div");
            item.className = "source-item";

            const label = document.createElement("div");
            label.className = "source-label";
            label.textContent = source.source + " · 片段 " + source.index;

            const original = document.createElement("p");
            original.className = "source-text";
            original.textContent = source.text;

            item.append(label, original);
            panel.append(item);
        }

        box.append(panel);
    }

    function addMessage(role, text, remember = true, sourceData = []) {
        const sources = role === "assistant"
            ? normalizeSources(sourceData)
            : [];

        const box = document.createElement("div");
        box.className = "message " + role;

        const label = document.createElement("div");
        label.className = "message-label";
        label.textContent = role === "user" ? "你" : "小智";

        const body = document.createElement("div");
        body.className = "message-body";
        body.textContent = text;

        box.append(label, body);
        appendSources(box, sources);
        $("messages").append(box);
        $("messages").scrollTop = $("messages").scrollHeight;

        if (remember) {
            history.push({role, text, sources});
            history = history.slice(-100);
            saveSession();
        }
    }

    function validateDraft(draft) {
        if (!draft ||
            typeof draft.draftId !== "string" ||
            !draftIdPattern.test(draft.draftId) ||
            !Object.hasOwn(draftStates, draft.status)) {
            throw new Error("草稿数据格式异常。");
        }

        if (draft.status === "CONFIRMED") {
            if (typeof draft.appointmentId !== "string" ||
                !draft.appointmentId.trim()) {
                throw new Error("已确认草稿缺少预约编号。");
            }
        } else if (draft.appointmentId != null) {
            throw new Error("草稿状态与预约编号不一致，请重新查询。");
        }
    }

    function renderChoices() {
        $("draftChoices").replaceChildren();
        $("draftCount").textContent = String(drafts.size);

        for (const draft of [...drafts.values()].reverse()) {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "draft-choice";

            button.classList.toggle(
                "selected",
                draft.draftId === selectedDraftId
            );

            button.setAttribute(
                "aria-pressed",
                String(draft.draftId === selectedDraftId)
            );

            const state = draftStates[draft.status] || "状态未核实";

            button.textContent =
                (draft.visitDate || "日期待查询") + " · " +
                (draft.department || "科室待查询") + " · " + state +
                "\n" + draft.draftId;

            button.addEventListener(
                "click",
                () => selectDraft(draft.draftId)
            );

            $("draftChoices").append(button);
        }

        updateControls();
    }

    function showUnavailable(hint) {
        currentDraft = null;
        $("draftDetails").replaceChildren();
        $("draftHint").textContent = hint;
        $("confirmButton").textContent = "确认创建演示预约";
        $("cancelButton").textContent = "取消当前草稿";
        $("confirmationNotice").textContent =
            "请先加载并核对草稿详情，再进行操作。";
        updateControls();
    }

    function addDetail(label, value) {
        const row = document.createElement("div");
        row.className = "detail-row";

        const title = document.createElement("div");
        title.className = "detail-label";
        title.textContent = label;

        const content = document.createElement("div");
        content.className = "detail-value";
        content.textContent = value == null ? "尚未生成" : String(value);

        row.append(title, content);
        $("draftDetails").append(row);
    }

    function displayDraft(draft) {
        validateDraft(draft);

        drafts.set(draft.draftId, draft);
        selectedDraftId = draft.draftId;
        currentDraft = draft;

        $("draftIdInput").value = draft.draftId;
        $("draftDetails").replaceChildren();

        const presentation = {
            PENDING_CONFIRMATION: {
                hint: "请核对当前草稿，再决定确认或取消。",
                button: "确认创建演示预约",
                notice: "按钮只操作当前展示的草稿。取消后不能恢复，需要重新创建草稿。"
            },
            CONFIRMING: {
                hint: "这份草稿已进入确认处理，当前不能取消。",
                button: "重试确认同一草稿",
                notice: "可先加载或同步查询最新结果；若仍为确认处理中，可点击重试继续处理。请勿另建草稿重试。"
            },
            CONFIRMED: {
                hint: "当前草稿已确认。",
                button: "已创建演示预约",
                notice: "本地演示预约已创建，不代表真实医院挂号成功。当前不提供取消已创建预约的功能。"
            },
            CANCELLED: {
                hint: "当前草稿已取消。",
                button: "已取消，不能确认",
                notice: "这份草稿已取消，记录仍然保留。如仍需预约，请重新生成草稿。"
            }
        }[draft.status];

        $("draftHint").textContent = presentation.hint;

        addDetail("草稿编号", draft.draftId);
        addDetail("状态", draftStates[draft.status]);
        addDetail("医院编号（演示）", draft.hospitalId);
        addDetail("科室", draft.department);
        addDetail("预约日期", draft.visitDate);
        addDetail("时区", draft.timeZone);
        addDetail("预约编号", draft.appointmentId);
        addDetail("说明", draft.message);

        $("confirmButton").textContent = presentation.button;
        $("cancelButton").textContent = draft.status === "CANCELLED"
            ? "草稿已取消"
            : "取消当前草稿";

        $("confirmationNotice").textContent = presentation.notice;

        resolvePendingOperation(draft);
        renderChoices();
        saveSession();
    }

    async function request(url, options = {}) {
        const response = await fetch(url, {
            ...options,
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error(
                "请求失败，HTTP 状态码：" + response.status
            );
        }

        return response.json();
    }

    async function fetchDraft(draftId) {
        if (!draftIdPattern.test(draftId)) {
            throw new Error("请提供完整的 DRAFT-... 编号。");
        }

        const draft = await request(
            "/api/appointments/drafts/" + encodeURIComponent(draftId)
        );

        if (draft.draftId !== draftId) {
            throw new Error("返回的草稿编号不一致。");
        }

        validateDraft(draft);
        return draft;
    }

    async function refreshDraft(draftId) {
        displayDraft(await fetchDraft(draftId));
    }

    async function selectDraft(draftId) {
        if (busy) return;
        setBusy(true);

        if (drafts.has(draftId)) {
            selectedDraftId = draftId;
        }

        renderChoices();
        saveSession();
        showUnavailable("正在从后端读取草稿……");
        setStatus("正在查询……");

        try {
            await refreshDraft(draftId);
            setStatus("草稿已刷新。");
        } catch (error) {
            if (drafts.has(draftId)) {
                drafts.set(draftId, {
                    ...drafts.get(draftId),
                    status: "UNVERIFIED"
                });
                renderChoices();
            }

            showUnavailable(
                "查询失败，草稿列表已保留，请重新选择后再确认。"
            );
            setStatus(error.message, true);
        } finally {
            saveSession();
            showOperationNotice();
            setBusy(false);
        }
    }

    function tomorrowInShanghai() {
        const parts = new Intl.DateTimeFormat("en-US", {
            timeZone: "Asia/Shanghai",
            year: "numeric",
            month: "2-digit",
            day: "2-digit"
        }).formatToParts(new Date());

        const value = type =>
            parts.find(part => part.type === type).value;

        return new Date(Date.UTC(
            Number(value("year")),
            Number(value("month")) - 1,
            Number(value("day")) + 1
        )).toISOString().slice(0, 10);
    }

    $("exampleButton").addEventListener("click", () => {
        $("messageInput").value =
            "我选择 DEMO001 的内科，预约日期是 " +
            tomorrowInShanghai() +
            "。请帮我生成一份演示预约草稿。";

        $("messageInput").focus();
        setStatus("已填入示例，请核对日期后发送。");
    });

    $("chatForm").addEventListener("submit", async event => {
        event.preventDefault();
        if (busy) return;

        const message = $("messageInput").value.trim();
        if (!message) return;

        addMessage("user", message);
        $("messageInput").value = "";

        setBusy(true);
        setStatus("小智正在回复，请稍候……");

        pendingOperation = "聊天请求";
        pendingDraftId = null;
        saveSession();

        try {
            const data = await request("/api/chat", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({conversationId, message})
            });

            if (typeof data.reply !== "string" ||
                !Array.isArray(data.drafts)) {
                throw new Error("聊天接口返回格式异常。");
            }

            addMessage("assistant", data.reply, true, data.sources);
            data.drafts.forEach(validateDraft);

            const newDrafts = [
                ...new Map(
                    data.drafts.map(draft => [draft.draftId, draft])
                ).values()
            ];

            newDrafts.forEach(draft =>
                drafts.set(draft.draftId, draft)
            );

            renderChoices();
            saveSession();

            if (newDrafts.length === 1) {
                displayDraft(newDrafts[0]);
            } else if (newDrafts.length > 1) {
                selectedDraftId = null;
                showUnavailable(
                    "本轮生成了多份草稿，请从列表中选择一份。"
                );
                renderChoices();
            } else if (selectedDraftId) {
                await refreshDraft(selectedDraftId);
            } else {
                showUnavailable(drafts.size
                    ? "请从列表中选择草稿。"
                    : "当前还没有草稿。");
            }

            pendingOperation = "";

            setStatus(newDrafts.length
                ? "回复完成，草稿已加入列表。"
                : "回复完成，已有草稿已保留。");
        } catch (error) {
            showUnavailable(
                "本轮结果未完整取得，请点击“同步当前会话草稿”核实。"
            );
            setStatus(
                error.message + "。请求不会自动重发。",
                true
            );
        } finally {
            saveSession();
            showOperationNotice();
            setBusy(false);
        }
    });

    $("draftForm").addEventListener("submit", event => {
        event.preventDefault();
        selectDraft($("draftIdInput").value.trim());
    });

    function markUnverified(draftId) {
        const draft = drafts.get(draftId);

        if (draft) {
            drafts.set(draftId, {
                ...draft,
                status: "UNVERIFIED"
            });
        }

        showUnavailable(
            "操作结果尚未核实，正在重新查询当前草稿……"
        );
        renderChoices();
    }

    async function runDraftAction(action) {
        if (busy || (action === "confirm"
            ? !canConfirm(currentDraft)
            : !canCancel(currentDraft))) {
            return;
        }

        const draftId = currentDraft.draftId;
        const isCancel = action === "cancel";

        if (isCancel && !window.confirm(
            "确定取消这份草稿吗？\n" +
            currentDraft.visitDate + " · " +
            currentDraft.department + "\n" +
            draftId + "\n取消后不能再确认这份草稿。"
        )) {
            return;
        }

        setBusy(true);

        pendingOperation = isCancel
            ? "取消草稿请求"
            : "预约确认请求";

        pendingDraftId = draftId;
        saveSession();
        showOperationNotice();

        setStatus(isCancel
            ? "正在取消当前草稿……"
            : "正在确认当前草稿……");

        const url =
            "/api/appointments/drafts/" +
            encodeURIComponent(draftId);

        try {
            const result = await request(
                url + "/" + action,
                {method: "POST"}
            );

            if (isCancel) {
                validateDraft(result);

                if (result.draftId !== draftId ||
                    result.status !== "CANCELLED") {
                    throw new Error("取消接口返回内容异常。");
                }
            } else if (result.status !== "DEMO_CREATED" ||
                !result.appointmentId) {
                throw new Error("确认接口返回内容异常。");
            }

            const latest = await fetchDraft(draftId);

            if (isCancel
                ? latest.status !== "CANCELLED"
                : latest.status !== "CONFIRMED" ||
                latest.appointmentId !== result.appointmentId) {
                throw new Error(
                    "操作结果与草稿查询结果不一致。"
                );
            }

            displayDraft(latest);

            setStatus(isCancel
                ? "草稿已取消，记录仍保留在列表中。"
                : "演示预约已创建，列表状态已更新。");
        } catch (error) {
            // POST 失败也可能已经写入。
            // 这里只查询，不自动重发操作。
            markUnverified(draftId);

            try {
                const latest = await fetchDraft(draftId);
                displayDraft(latest);

                const completed = isCancel
                    ? latest.status === "CANCELLED"
                    : latest.status === "CONFIRMED";

                if (completed) {
                    setStatus(
                        "操作响应未完整取得；已通过查询核实，当前草稿" +
                        draftStates[latest.status] + "。"
                    );
                } else {
                    setStatus(
                        error.message +
                        " 当前状态：" + draftStates[latest.status] +
                        "。请按右侧提示操作；请求不会自动重发。",
                        true
                    );
                }
            } catch (queryError) {
                showUnavailable(
                    "未能核实操作结果，请重新加载同一份草稿或点击同步。"
                );

                setStatus(
                    error.message +
                    " 查询也未成功：" + queryError.message,
                    true
                );
            }
        } finally {
            saveSession();
            showOperationNotice();
            setBusy(false);
        }
    }

    $("confirmButton").addEventListener(
        "click",
        () => runDraftAction("confirm")
    );

    $("cancelButton").addEventListener(
        "click",
        () => runDraftAction("cancel")
    );

    $("newChatButton").addEventListener("click", () => {
        if (busy) return;

        conversationId = crypto.randomUUID();
        drafts.clear();
        history = [];
        pendingOperation = "";
        pendingDraftId = null;
        showOperationNotice();
        selectedDraftId = null;

        $("messages").replaceChildren();
        $("messageInput").value = "";
        $("draftIdInput").value = "";

        showUnavailable(
            "新会话已开始。旧草稿和预约仍保留在数据库中。"
        );

        renderChoices();
        setStatus("");

        addMessage(
            "assistant",
            "你好，我是小智。可以交流需求，也可以准备演示预约草稿。"
        );
    });

    async function synchronizeDrafts() {
        const previousIds = new Set(drafts.keys());

        showUnavailable("正在从后端同步草稿……");

        for (const [id, draft] of drafts) {
            drafts.set(id, {
                ...draft,
                status: "UNVERIFIED"
            });
        }

        renderChoices();

        let listError = "";

        try {
            const list = await request(
                "/api/appointments/drafts?conversationId=" +
                encodeURIComponent(conversationId)
            );

            if (!Array.isArray(list)) {
                throw new Error("会话草稿接口应返回数组。");
            }

            list.forEach(validateDraft);

            // 接口按新到旧返回；Map 的页面显示顺序相反。
            for (const draft of [...list].reverse()) {
                drafts.set(draft.draftId, draft);
            }
        } catch (error) {
            listError = error.message;
        }

        // 单独核实旧版草稿、手动加载项，
        // 以及不在最近 100 份中的已知草稿。
        const unresolved = [...drafts.values()]
            .filter(draft => draft.status === "UNVERIFIED")
            .map(draft => draft.draftId);

        const results = await Promise.allSettled(
            unresolved.map(fetchDraft)
        );

        results.forEach((result, index) => {
            if (result.status === "fulfilled") {
                drafts.set(unresolved[index], result.value);
            }
        });

        const selected = drafts.get(selectedDraftId);

        if (selected && selected.status !== "UNVERIFIED") {
            displayDraft(selected);
        } else {
            showUnavailable(selectedDraftId
                ? "当前草稿尚未核实，请点击列表重试；核实前不能操作。"
                : drafts.size
                    ? "请选择一份草稿，核对详情后再确认。"
                    : "当前没有已加载的草稿。");
        }

        renderChoices();
        saveSession();
        showOperationNotice();

        const added = [...drafts.keys()]
            .filter(id => !previousIds.has(id)).length;

        const failed = [...drafts.values()]
            .filter(draft => draft.status === "UNVERIFIED").length;

        const summary =
            "本次找回 " + added + " 份，本页共 " +
            drafts.size + " 份草稿。";

        if (listError) {
            setStatus(
                "当前会话列表查询失败：" + listError +
                "。已有编号已尝试单独核实；" +
                failed + " 份状态未核实。请稍后重新同步。",
                true
            );
        } else if (failed) {
            setStatus(
                summary + "其中 " + failed +
                " 份旧记录未能核实，请点击重试。",
                true
            );
        } else {
            setStatus("会话草稿同步完成。" + summary);
        }
    }

    $("syncButton").addEventListener("click", async () => {
        if (busy) return;
        setBusy(true);

        try {
            await synchronizeDrafts();
        } catch (error) {
            showUnavailable("同步未完成，请稍后重新同步。");
            setStatus(error.message, true);
        } finally {
            setBusy(false);
        }
    });

    async function restoreSession() {
        setBusy(true);
        showUnavailable("正在恢复当前标签页……");

        let saved = null;
        let readError = false;

        try {
            const raw = sessionStorage.getItem(storageKey);

            if (raw) {
                const value = JSON.parse(raw);

                if (value.version !== 1 ||
                    typeof value.conversationId !== "string" ||
                    !/^[0-9a-f-]{36}$/i.test(value.conversationId) ||
                    !Array.isArray(value.draftIds) ||
                    !value.draftIds.every(id =>
                        typeof id === "string" &&
                        draftIdPattern.test(id)) ||
                    !Array.isArray(value.history) ||
                    !value.history.every(item =>
                        item &&
                        ["user", "assistant"].includes(item.role) &&
                        typeof item.text === "string")) {
                    throw new Error("暂存内容无效");
                }

                saved = value;
            }
        } catch (error) {
            readError = true;
        }

        if (saved) {
            conversationId = saved.conversationId;
            history = saved.history.slice(-100).map(item => ({
                role: item.role,
                text: item.text,
                sources: item.role === "assistant"
                    ? normalizeSources(item.sources)
                    : []
            }));

            history.forEach(item =>
                addMessage(item.role, item.text, false, item.sources)
            );

            pendingOperation =
                typeof saved.pendingOperation === "string"
                    ? saved.pendingOperation
                    : "";

            const ids = [...new Set(saved.draftIds)];

            ids.forEach(draftId =>
                drafts.set(draftId, {
                    draftId,
                    status: "UNVERIFIED"
                })
            );

            selectedDraftId = ids.includes(saved.selectedDraftId)
                ? saved.selectedDraftId
                : null;

            pendingDraftId =
                typeof saved.pendingDraftId === "string" &&
                draftIdPattern.test(saved.pendingDraftId)
                    ? saved.pendingDraftId
                    : pendingOperation === "预约确认请求"
                        ? selectedDraftId
                        : null;
        } else {
            addMessage(
                "assistant",
                "你好，我是小智。可以交流需求，也可以准备演示预约草稿。"
            );
        }

        saveSession();
        showOperationNotice();

        try {
            await synchronizeDrafts();
        } catch (error) {
            showUnavailable("恢复未完成，请点击同步按钮重试。");
            setStatus(error.message, true);
        } finally {
            setBusy(false);

            if (readError) {
                $("storageNotice").textContent =
                    "未能读取旧暂存，当前使用新的会话编号。数据库记录未删除。";
            }
        }
    }

    restoreSession();
</script>
</body>
</html>
