<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>小智 · 医疗导诊演示</title>
    <style>
        :root {
            color-scheme: light;
            font-family: "Microsoft YaHei", system-ui, sans-serif;
            color: #243449;
            background: #f3f6fa;
        }

        * { box-sizing: border-box; }

        body { margin: 0; }

        main {
            max-width: 1160px;
            margin: 36px auto;
            padding: 0 20px;
        }

        header { margin-bottom: 24px; }

        h1 { margin: 0 0 10px; font-size: 28px; }

        h2 { margin: 0; font-size: 19px; }

        p { line-height: 1.7; }

        .muted { color: #63748a; font-size: 14px; }

        .layout {
            display: grid;
            grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
            gap: 22px;
            align-items: start;
        }

        .panel {
            background: white;
            border: 1px solid #e0e7ef;
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 8px 28px #263b5710;
        }

        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 18px;
        }

        button {
            border: 0;
            border-radius: 10px;
            padding: 11px 16px;
            font: inherit;
            font-size: 14px;
            background: #2364d2;
            color: white;
            cursor: pointer;
        }

        button.secondary {
            background: #edf2fa;
            color: #315782;
        }

        button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        button:focus-visible, input:focus, textarea:focus {
            outline: 3px solid #b5d1ff;
            outline-offset: 2px;
        }

        #messages {
            height: 410px;
            overflow-y: auto;
            padding: 4px 4px 12px;
        }

        .message {
            margin: 0 0 16px;
            padding: 13px 15px;
            background: #f0f4f9;
            border-radius: 12px;
        }

        .message.user { background: #e9f1ff; }

        .message-label {
            font-size: 12px;
            color: #63748a;
            margin-bottom: 7px;
        }

        .message-body {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            line-height: 1.75;
            font-size: 14px;
        }

        textarea, input {
            width: 100%;
            border: 1px solid #ccd7e4;
            border-radius: 10px;
            padding: 12px;
            font: inherit;
            font-size: 14px;
            color: inherit;
            background: white;
        }

        textarea { resize: vertical; min-height: 96px; }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .notice {
            padding: 12px 14px;
            background: #fff7e8;
            border: 1px solid #f1dfba;
            border-radius: 10px;
            color: #795b22;
            font-size: 14px;
            line-height: 1.7;
        }

        #status {
            min-height: 24px;
            margin-top: 12px;
            font-size: 14px;
            color: #496584;
            overflow-wrap: anywhere;
        }

        #status.error { color: #b83232; }

        #draftDetails { margin: 18px 0; }

        .detail-row {
            padding: 11px 0;
            border-bottom: 1px solid #edf1f5;
        }

        .detail-label {
            color: #63748a;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .detail-value {
            font-size: 14px;
            overflow-wrap: anywhere;
            line-height: 1.6;
        }

        #confirmButton { width: 100%; }

        #draftForm {
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid #e0e7ef;
        }

        label { display: block; margin-bottom: 8px; font-size: 14px; }

        @media (max-width: 800px) {
            main { margin: 20px auto; }
            .layout { grid-template-columns: 1fr; }
            #messages { height: 340px; }
        }
    </style>
</head>
<body>
<main>
    <header>
        <h1>小智 · 医疗导诊演示</h1>
        <p class="muted">
            当前支持：虚构医院 DEMO001 · 内科 · 上海时区。
            仅用于学习，不连接真实医院号源。
        </p>
    </header>

    <div class="layout">
        <section class="panel">
            <div class="toolbar">
                <h2>与小智交流</h2>
                <button id="newChatButton" class="secondary" type="button">
                    新会话
                </button>
            </div>

            <div id="messages" role="log" aria-live="polite"></div>

            <form id="chatForm">
                <label for="messageInput">你的消息</label>
                <textarea id="messageInput"
                          maxlength="2000"
                          placeholder="例如：我想了解演示预约流程。"
                          required></textarea>

                <div class="actions">
                    <button id="sendButton" type="submit">发送消息</button>
                    <button id="exampleButton"
                            class="secondary"
                            type="button">
                        填入演示预约请求
                    </button>
                </div>
            </form>

            <div id="status" role="status" aria-live="polite"></div>
        </section>

        <section class="panel">
            <h2>预约草稿</h2>

            <p id="draftHint" class="muted">
                聊天生成草稿后，这里会显示从后端读取的预约内容。
            </p>

            <div id="draftDetails"></div>

            <p class="notice">
                请核对医院、科室和日期。只有点击下方按钮，
                才会提交这份草稿的确认请求。
                创建的记录仅为本地演示预约。
            </p>

            <button id="confirmButton" type="button" disabled>
                确认创建演示预约
            </button>

            <form id="draftForm">
                <label for="draftIdInput">也可以手动加载已有草稿</label>
                <input id="draftIdInput"
                       type="text"
                       placeholder="粘贴完整的 DRAFT-... 编号"
                       autocomplete="off"
                       required>

                <div class="actions">
                    <button id="loadButton"
                            class="secondary"
                            type="submit">
                        加载 / 刷新草稿
                    </button>
                </div>
            </form>
        </section>
    </div>
</main>

<script>
    const $ = id => document.getElementById(id);

    const draftPattern =
        /DRAFT-[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/g;

    const fullDraftPattern =
        /^DRAFT-[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$/;

    let conversationId = crypto.randomUUID();
    let currentDraft = null;
    let busy = false;

    function setStatus(message, isError = false) {
        $("status").textContent = message;
        $("status").classList.toggle("error", isError);
    }

    function updateControls() {
        for (const id of [
            "sendButton",
            "newChatButton",
            "exampleButton",
            "loadButton"
        ]) {
            $(id).disabled = busy;
        }

        $("messageInput").disabled = busy;
        $("draftIdInput").disabled = busy;

        $("confirmButton").disabled =
            busy ||
            !currentDraft ||
            currentDraft.status !== "PENDING_CONFIRMATION" ||
            currentDraft.appointmentId != null;
    }

    function setBusy(value) {
        busy = value;
        updateControls();
    }

    function addMessage(role, text) {
        const box = document.createElement("div");
        box.className = "message " + role;

        const label = document.createElement("div");
        label.className = "message-label";
        label.textContent = role === "user" ? "你" : "小智";

        const body = document.createElement("div");
        body.className = "message-body";
        body.textContent = text;

        box.append(label, body);
        $("messages").append(box);
        $("messages").scrollTop = $("messages").scrollHeight;
    }

    function clearDraft(hint) {
        currentDraft = null;
        $("draftDetails").replaceChildren();
        $("draftHint").textContent = hint;
        updateControls();
    }

    function addDetail(label, value) {
        const row = document.createElement("div");
        row.className = "detail-row";

        const title = document.createElement("div");
        title.className = "detail-label";
        title.textContent = label;

        const content = document.createElement("div");
        content.className = "detail-value";
        content.textContent = value == null ? "尚未生成" : String(value);

        row.append(title, content);
        $("draftDetails").append(row);
    }

    function renderDraft(draft) {
        currentDraft = draft;
        $("draftIdInput").value = draft.draftId;
        $("draftDetails").replaceChildren();

        const confirmed = draft.status === "CONFIRMED";

        $("draftHint").textContent = confirmed
            ? "这份草稿已确认，关联的演示预约如下。"
            : "已从后端读取草稿，请核对以下内容。";

        addDetail("草稿编号", draft.draftId);
        addDetail("状态", confirmed ? "已确认" : "待确认");
        addDetail("医院编号（演示）", draft.hospitalId);
        addDetail("科室", draft.department);
        addDetail("预约日期", draft.visitDate);
        addDetail("时区", draft.timeZone);
        addDetail("预约编号", draft.appointmentId);
        addDetail("说明", draft.message);

        updateControls();
    }

    async function request(url, options = {}, asJson = true) {
        const response = await fetch(url, {
            ...options,
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error("请求失败，HTTP 状态码：" + response.status);
        }

        return asJson ? response.json() : response.text();
    }

    async function loadDraft(draftId) {
        if (!fullDraftPattern.test(draftId)) {
            throw new Error("请提供完整的 DRAFT-... 草稿编号。");
        }

        const draft = await request(
            "/api/appointments/drafts/" + encodeURIComponent(draftId)
        );

        if (draft.draftId !== draftId ||
            !["PENDING_CONFIRMATION", "CONFIRMED"].includes(draft.status)) {
            throw new Error("后端返回的草稿信息异常，暂不能确认。");
        }

        renderDraft(draft);
    }

    function tomorrowInShanghai() {
        const parts = new Intl.DateTimeFormat("en-US", {
            timeZone: "Asia/Shanghai",
            year: "numeric",
            month: "2-digit",
            day: "2-digit"
        }).formatToParts(new Date());

        const value = type => parts.find(part => part.type === type).value;

        const date = new Date(Date.UTC(
            Number(value("year")),
            Number(value("month")) - 1,
            Number(value("day")) + 1
        ));

        return date.toISOString().slice(0, 10);
    }

    $("exampleButton").addEventListener("click", () => {
        $("messageInput").value =
            "我选择 DEMO001 的内科，预约日期是 " +
            tomorrowInShanghai() +
            "。请帮我生成一份演示预约草稿。";

        $("messageInput").focus();
        setStatus("已填入示例，请核对日期后点击“发送消息”。");
    });

    $("chatForm").addEventListener("submit", async event => {
        event.preventDefault();
        if (busy) return;

        const message = $("messageInput").value.trim();
        if (!message) return;

        addMessage("user", message);
        $("messageInput").value = "";

        clearDraft("正在处理本轮消息，草稿详情将在查询后显示。");
        setBusy(true);
        setStatus("小智正在回复，请稍候……");

        try {
            const params = new URLSearchParams({
                conversationId,
                message
            });

            const reply = await request(
                "/api/chat?" + params.toString(),
                {},
                false
            );

            addMessage("assistant", reply);
            setStatus("回复完成。");

            const ids = [...new Set(reply.match(draftPattern) || [])];

            if (ids.length === 1) {
                try {
                    await loadDraft(ids[0]);
                    setStatus("草稿已核实，请查看右侧内容。");
                } catch (error) {
                    clearDraft("未能核实草稿，请检查编号后手动加载。");
                    setStatus("聊天已返回，但草稿查询失败：" + error.message, true);
                }
            } else if (ids.length > 1) {
                clearDraft("回复包含多个草稿编号，请手动加载你要查看的那一份。");
            } else {
                clearDraft("本轮回复没有完整草稿编号，也可以手动加载已有草稿。");
            }
        } catch (error) {
            clearDraft("本轮请求未完成，可通过已有编号查询草稿。");
            setStatus(
                error.message + "。请检查后端是否运行；请求不会自动重发。",
                true
            );
        } finally {
            setBusy(false);
        }
    });

    $("draftForm").addEventListener("submit", async event => {
        event.preventDefault();
        if (busy) return;

        const draftId = $("draftIdInput").value.trim();

        clearDraft("正在读取草稿……");
        setBusy(true);
        setStatus("正在查询……");

        try {
            await loadDraft(draftId);
            setStatus("草稿已加载。");
        } catch (error) {
            clearDraft("加载失败，请核对草稿编号。");
            setStatus(error.message, true);
        } finally {
            setBusy(false);
        }
    });

    $("confirmButton").addEventListener("click", async () => {
        if (busy ||
            !currentDraft ||
            currentDraft.status !== "PENDING_CONFIRMATION" ||
            currentDraft.appointmentId != null) {
            return;
        }

        const draft = currentDraft;

        setBusy(true);
        setStatus("正在确认这份演示预约，请勿关闭页面……");

        try {
            const appointment = await request(
                "/api/appointments/drafts/" +
                encodeURIComponent(draft.draftId) +
                "/confirm",
                {method: "POST"}
            );

            if (appointment.status !== "DEMO_CREATED" ||
                !appointment.appointmentId) {
                throw new Error("确认接口返回内容异常。");
            }

            renderDraft({
                ...draft,
                status: "CONFIRMED",
                appointmentId: appointment.appointmentId,
                message: appointment.message
            });

            setStatus("演示预约已创建。该记录不代表真实医院挂号成功。");
        } catch (error) {
            setStatus(
                error.message +
                "。尚未核实确认结果，请刷新此草稿；重试时使用同一份草稿。",
                true
            );
        } finally {
            setBusy(false);
        }
    });

    $("newChatButton").addEventListener("click", () => {
        if (busy) return;

        conversationId = crypto.randomUUID();
        $("messages").replaceChildren();
        $("messageInput").value = "";
        $("draftIdInput").value = "";

        clearDraft("新会话已开始。之前保存的草稿和预约不会被删除。");
        setStatus("");

        addMessage(
            "assistant",
            "你好，我是小智。你可以咨询导诊信息，或准备一份演示预约草稿。"
        );
    });

    addMessage(
        "assistant",
        "你好，我是小智。你可以先交流需求，也可以点击“填入演示预约请求”体验草稿流程。"
    );
</script>
</body>
</html>
