<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>小智 · 医疗导诊演示</title>
    <style>
        :root {
            font-family: "Microsoft YaHei", system-ui, sans-serif;
            color: #243449;
            background: #f3f6fa;
            color-scheme: light;
        }
        * { box-sizing: border-box; }
        body { margin: 0; }
        main { max-width: 1160px; margin: 36px auto; padding: 0 20px; }
        header { margin-bottom: 24px; }
        h1 { margin: 0 0 10px; font-size: 28px; }
        h2 { margin: 0; font-size: 19px; }
        p { line-height: 1.7; }
        .muted { color: #63748a; font-size: 14px; }
        .layout {
            display: grid;
            grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
            gap: 22px;
            align-items: start;
        }
        .panel {
            background: white;
            border: 1px solid #e0e7ef;
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 8px 28px #263b5710;
        }
        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 18px;
        }
        button {
            border: 0;
            border-radius: 10px;
            padding: 11px 16px;
            font: inherit;
            font-size: 14px;
            background: #2364d2;
            color: white;
            cursor: pointer;
        }
        button.secondary { background: #edf2fa; color: #315782; }
        button:disabled { opacity: .5; cursor: not-allowed; }
        button:focus-visible, input:focus, textarea:focus {
            outline: 3px solid #b5d1ff;
            outline-offset: 2px;
        }
        #messages {
            height: 410px;
            overflow-y: auto;
            padding: 4px 4px 12px;
        }
        .message {
            margin-bottom: 16px;
            padding: 13px 15px;
            background: #f0f4f9;
            border-radius: 12px;
        }
        .message.user { background: #e9f1ff; }
        .message-label {
            font-size: 12px;
            color: #63748a;
            margin-bottom: 7px;
        }
        .message-body {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            line-height: 1.75;
            font-size: 14px;
        }
        textarea, input {
            width: 100%;
            border: 1px solid #ccd7e4;
            border-radius: 10px;
            padding: 12px;
            font: inherit;
            font-size: 14px;
            color: inherit;
            background: white;
        }
        textarea { resize: vertical; min-height: 96px; }
        .actions {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .notice {
            padding: 12px 14px;
            background: #fff7e8;
            border: 1px solid #f1dfba;
            border-radius: 10px;
            color: #795b22;
            font-size: 14px;
            line-height: 1.7;
        }
        #status {
            min-height: 24px;
            margin-top: 12px;
            font-size: 14px;
            color: #496584;
            overflow-wrap: anywhere;
        }
        #status.error { color: #b83232; }
        #draftChoices {
            display: grid;
            gap: 8px;
            max-height: 230px;
            overflow-y: auto;
            margin: 14px 0;
        }
        .draft-choice {
            width: 100%;
            text-align: left;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            line-height: 1.6;
            background: #f4f7fb;
            color: #405975;
            border: 1px solid #dde5ef;
        }
        .draft-choice.selected {
            background: #e9f1ff;
            border-color: #2364d2;
            color: #174997;
        }
        #draftDetails { margin: 18px 0; }
        .detail-row {
            padding: 11px 0;
            border-bottom: 1px solid #edf1f5;
        }
        .detail-label {
            color: #63748a;
            font-size: 12px;
            margin-bottom: 5px;
        }
        .detail-value {
            font-size: 14px;
            overflow-wrap: anywhere;
            line-height: 1.6;
        }
        #confirmButton { width: 100%; }
        #draftForm {
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid #e0e7ef;
        }
        label { display: block; margin-bottom: 8px; font-size: 14px; }
        @media (max-width: 800px) {
            main { margin: 20px auto; }
            .layout { grid-template-columns: 1fr; }
            #messages { height: 340px; }
        }
    </style>
</head>
<body>
<main>
    <header>
        <h1>小智 · 医疗导诊演示</h1>
        <p class="muted">
            当前支持：虚构医院 DEMO001 · 内科 · 上海时区。
            仅用于学习，不连接真实医院号源。
        </p>
    </header>

    <div class="layout">
        <section class="panel">
            <div class="toolbar">
                <h2>与小智交流</h2>
                <button id="newChatButton" class="secondary" type="button">
                    新会话
                </button>
            </div>

            <div id="messages" role="log" aria-live="polite"></div>

            <form id="chatForm">
                <label for="messageInput">你的消息</label>
                <textarea id="messageInput" maxlength="2000"
                          placeholder="例如：我想了解演示预约流程。"
                          required></textarea>

                <div class="actions">
                    <button id="sendButton" type="submit">发送消息</button>
                    <button id="exampleButton" class="secondary" type="button">
                        填入演示预约请求
                    </button>
                </div>
            </form>

            <div id="status" role="status" aria-live="polite"></div>
        </section>

        <section class="panel">
            <div class="toolbar">
                <h2>草稿列表</h2>
                <span class="muted">共 <span id="draftCount">0</span> 份</span>
            </div>

            <p class="muted">
                保留本页收到或手动加载的草稿，点击可刷新状态。
                新会话或刷新网页会清空此列表，数据库记录仍保留。
            </p>

            <div id="draftChoices"></div>

            <h2>当前草稿详情</h2>
            <p id="draftHint" class="muted"></p>
            <div id="draftDetails"></div>

            <p id="confirmationNotice" class="notice"></p>

            <button id="confirmButton" type="button" disabled>
                确认创建演示预约
            </button>

            <form id="draftForm">
                <label for="draftIdInput">手动加载已有草稿</label>
                <input id="draftIdInput" type="text"
                       placeholder="粘贴完整的 DRAFT-... 编号"
                       autocomplete="off" required>

                <div class="actions">
                    <button id="loadButton" class="secondary" type="submit">
                        加载 / 刷新草稿
                    </button>
                </div>
            </form>
        </section>
    </div>
</main>

<script>
    const $ = id => document.getElementById(id);

    const draftIdPattern =
        /^DRAFT-[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$/;

    let conversationId = crypto.randomUUID();

    // 当前页面的草稿列表，以草稿编号去重。
    const drafts = new Map();

    let selectedDraftId = null;
    let currentDraft = null;
    let busy = false;

    function setStatus(text, error = false) {
        $("status").textContent = text;
        $("status").classList.toggle("error", error);
    }

    function updateControls() {
        for (const id of [
            "sendButton", "newChatButton", "exampleButton", "loadButton"
        ]) {
            $(id).disabled = busy;
        }

        for (const button of $("draftChoices").querySelectorAll("button")) {
            button.disabled = busy;
        }

        $("messageInput").disabled = busy;
        $("draftIdInput").disabled = busy;

        $("confirmButton").disabled =
            busy ||
            !currentDraft ||
            currentDraft.status !== "PENDING_CONFIRMATION" ||
            currentDraft.appointmentId != null;
    }

    function setBusy(value) {
        busy = value;
        updateControls();
    }

    function addMessage(role, text) {
        const box = document.createElement("div");
        box.className = "message " + role;

        const label = document.createElement("div");
        label.className = "message-label";
        label.textContent = role === "user" ? "你" : "小智";

        const body = document.createElement("div");
        body.className = "message-body";
        body.textContent = text;

        box.append(label, body);
        $("messages").append(box);
        $("messages").scrollTop = $("messages").scrollHeight;
    }

    function validateDraft(draft) {
        if (!draft ||
            typeof draft.draftId !== "string" ||
            !draftIdPattern.test(draft.draftId) ||
            !["PENDING_CONFIRMATION", "CONFIRMED"].includes(draft.status)) {
            throw new Error("草稿数据格式异常。");
        }
    }

    function renderChoices() {
        $("draftChoices").replaceChildren();
        $("draftCount").textContent = String(drafts.size);

        for (const draft of [...drafts.values()].reverse()) {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "draft-choice";

            const selected = draft.draftId === selectedDraftId;

            button.classList.toggle("selected", selected);
            button.setAttribute("aria-pressed", String(selected));

            const state = draft.status === "CONFIRMED"
                ? "已确认"
                : "待确认";

            button.textContent =
                draft.visitDate + " · " + draft.department + " · " + state +
                "\n" + draft.draftId;

            button.addEventListener(
                "click",
                () => selectDraft(draft.draftId)
            );

            $("draftChoices").append(button);
        }

        updateControls();
    }

    function showUnavailable(hint) {
        currentDraft = null;
        $("draftDetails").replaceChildren();
        $("draftHint").textContent = hint;
        $("confirmButton").textContent = "确认创建演示预约";
        $("confirmationNotice").textContent =
            "请先加载并核对草稿详情，再确认。";
        updateControls();
    }

    function addDetail(label, value) {
        const row = document.createElement("div");
        row.className = "detail-row";

        const title = document.createElement("div");
        title.className = "detail-label";
        title.textContent = label;

        const content = document.createElement("div");
        content.className = "detail-value";
        content.textContent = value == null
            ? "尚未生成"
            : String(value);

        row.append(title, content);
        $("draftDetails").append(row);
    }

    function displayDraft(draft) {
        validateDraft(draft);

        drafts.set(draft.draftId, draft);
        selectedDraftId = draft.draftId;
        currentDraft = draft;

        $("draftIdInput").value = draft.draftId;
        $("draftDetails").replaceChildren();

        const confirmed = draft.status === "CONFIRMED";

        $("draftHint").textContent = confirmed
            ? "当前草稿已确认。"
            : "请核对当前草稿，再决定是否确认。";

        addDetail("草稿编号", draft.draftId);
        addDetail("状态", confirmed ? "已确认" : "待确认");
        addDetail("医院编号（演示）", draft.hospitalId);
        addDetail("科室", draft.department);
        addDetail("预约日期", draft.visitDate);
        addDetail("时区", draft.timeZone);
        addDetail("预约编号", draft.appointmentId);
        addDetail("说明", draft.message);

        $("confirmButton").textContent = confirmed
            ? "已创建演示预约"
            : "确认创建演示预约";

        $("confirmationNotice").textContent = confirmed
            ? "本地演示预约已创建，不代表真实医院挂号成功。"
            : "按钮只确认当前展示的草稿。聊天中的“确认”不会创建预约。";

        renderChoices();
    }

    async function request(url, options = {}) {
        const response = await fetch(url, {
            ...options,
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error(
                "请求失败，HTTP 状态码：" + response.status
            );
        }

        return response.json();
    }

    async function refreshDraft(draftId) {
        if (!draftIdPattern.test(draftId)) {
            throw new Error("请提供完整的 DRAFT-... 编号。");
        }

        const draft = await request(
            "/api/appointments/drafts/" + encodeURIComponent(draftId)
        );

        if (draft.draftId !== draftId) {
            throw new Error("返回的草稿编号不一致。");
        }

        displayDraft(draft);
    }

    async function selectDraft(draftId) {
        if (busy) return;

        setBusy(true);
        showUnavailable("正在从后端读取草稿……");
        setStatus("正在查询……");

        try {
            await refreshDraft(draftId);
            setStatus("草稿已刷新。");
        } catch (error) {
            showUnavailable(
                "查询失败，草稿列表已保留，请重新选择后再确认。"
            );
            setStatus(error.message, true);
        } finally {
            setBusy(false);
        }
    }

    function tomorrowInShanghai() {
        const parts = new Intl.DateTimeFormat("en-US", {
            timeZone: "Asia/Shanghai",
            year: "numeric",
            month: "2-digit",
            day: "2-digit"
        }).formatToParts(new Date());

        const value = type =>
            parts.find(part => part.type === type).value;

        return new Date(Date.UTC(
            Number(value("year")),
            Number(value("month")) - 1,
            Number(value("day")) + 1
        )).toISOString().slice(0, 10);
    }

    $("exampleButton").addEventListener("click", () => {
        $("messageInput").value =
            "我选择 DEMO001 的内科，预约日期是 " +
            tomorrowInShanghai() +
            "。请帮我生成一份演示预约草稿。";

        $("messageInput").focus();
        setStatus("已填入示例，请核对日期后发送。");
    });

    $("chatForm").addEventListener("submit", async event => {
        event.preventDefault();
        if (busy) return;

        const message = $("messageInput").value.trim();
        if (!message) return;

        addMessage("user", message);
        $("messageInput").value = "";

        // 保留已有列表和详情，请求期间禁用操作。
        setBusy(true);
        setStatus("小智正在回复，请稍候……");

        try {
            const data = await request("/api/chat", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({conversationId, message})
            });

            if (typeof data.reply !== "string" ||
                !Array.isArray(data.drafts)) {
                throw new Error("聊天接口返回格式异常。");
            }

            addMessage("assistant", data.reply);
            data.drafts.forEach(validateDraft);

            const newDrafts = [
                ...new Map(
                    data.drafts.map(draft => [draft.draftId, draft])
                ).values()
            ];

            // 合并本轮草稿，已有草稿不会被空列表清除。
            newDrafts.forEach(draft => {
                drafts.set(draft.draftId, draft);
            });

            renderChoices();

            if (newDrafts.length === 1) {
                displayDraft(newDrafts[0]);

            } else if (newDrafts.length > 1) {
                selectedDraftId = null;

                showUnavailable(
                    "本轮生成了多份草稿，请从列表中选择一份。"
                );

                renderChoices();

            } else if (selectedDraftId) {
                // 普通聊天后，刷新原来选中的草稿。
                await refreshDraft(selectedDraftId);

            } else {
                showUnavailable(
                    drafts.size
                        ? "请从列表中选择草稿。"
                        : "当前还没有草稿。"
                );
            }

            setStatus(
                newDrafts.length
                    ? "回复完成，草稿已加入列表。"
                    : "回复完成，已有草稿已保留。"
            );

        } catch (error) {
            showUnavailable(
                "本轮结果未完整取得。已有列表保留，请重新选择草稿核实状态。"
            );

            setStatus(
                error.message + "。请求不会自动重发。",
                true
            );
        } finally {
            setBusy(false);
        }
    });

    $("draftForm").addEventListener("submit", event => {
        event.preventDefault();
        selectDraft($("draftIdInput").value.trim());
    });

    $("confirmButton").addEventListener("click", async () => {
        if (busy ||
            !currentDraft ||
            currentDraft.status !== "PENDING_CONFIRMATION" ||
            currentDraft.appointmentId != null) {
            return;
        }

        // 点击时锁定当前草稿编号。
        const draftId = currentDraft.draftId;

        setBusy(true);
        setStatus("正在确认当前展示的草稿……");

        try {
            const appointment = await request(
                "/api/appointments/drafts/" +
                encodeURIComponent(draftId) +
                "/confirm",
                {method: "POST"}
            );

            if (appointment.status !== "DEMO_CREATED" ||
                !appointment.appointmentId) {
                throw new Error("确认接口返回内容异常。");
            }

            // 再次查询数据库，更新详情和列表中的状态。
            await refreshDraft(draftId);

            if (currentDraft.status !== "CONFIRMED" ||
                currentDraft.appointmentId !== appointment.appointmentId) {
                throw new Error("确认结果与草稿查询结果不一致。");
            }

            setStatus("演示预约已创建，列表状态已更新。");

        } catch (error) {
            showUnavailable(
                "确认结果尚未核实，请点击列表中的同一份草稿重新查询。"
            );

            setStatus(
                error.message + "。请勿另建草稿来重试此次确认。",
                true
            );
        } finally {
            setBusy(false);
        }
    });

    $("newChatButton").addEventListener("click", () => {
        if (busy) return;

        conversationId = crypto.randomUUID();
        drafts.clear();
        selectedDraftId = null;

        $("messages").replaceChildren();
        $("messageInput").value = "";
        $("draftIdInput").value = "";

        showUnavailable(
            "新会话已开始。旧草稿和预约仍保留在数据库中。"
        );

        renderChoices();
        setStatus("");

        addMessage(
            "assistant",
            "你好，我是小智。可以交流需求，也可以准备演示预约草稿。"
        );
    });

    renderChoices();
    showUnavailable("生成草稿后，可在列表中切换查看。");

    addMessage(
        "assistant",
        "你好，我是小智。可以交流需求，也可以点击“填入演示预约请求”。"
    );
</script>
</body>
</html>
