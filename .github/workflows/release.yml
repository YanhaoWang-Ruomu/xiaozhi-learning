name: Verified GitHub release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Require green main CI on the exact release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&branch=main&status=success" --jq '.workflow_runs | length' > /tmp/passed
          test "$(cat /tmp/passed)" -gt 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Check MCP and build production frontend
        run: |
          cd mcp
          npm ci --ignore-scripts
          npm test
          npm audit --audit-level=low
          cd ../xiaozhi-ui
          npm ci
          npm run test:ci
          npm audit --audit-level=low
          npm run build
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Validate optional Python evaluation service and record UI demo
        run: |
          cd python-eval
          python -m pip install -r requirements.txt
          python -m pip check
          python -m pytest -q
          python smoke.py test-results/http
          cd ../xiaozhi-ui
          npx playwright install --with-deps chromium
          node scripts/record-demo.mjs test-results/demo
      - name: Validate independent intent dependencies and packaging rules
        run: |
          python -m unittest discover -s scripts -p test_release_extras.py
          python -m pip install -r ml-intent/requirements.txt
          python -m pip check
      - name: Package executable application and operating instructions
        run: |
          mvn -B -ntp -f backend/pom.xml -Prelease-ui -DskipTests clean package
          mkdir -p release/config
          cp backend/target/backend-1.0-SNAPSHOT.jar release/xiaozhi.jar
          cp deploy/start.ps1 release/
          cp deploy/application.properties.example release/config/application.properties
          python scripts/stage-release-extras.py --source . --release release
          (cd release/python-eval && python -m pytest -q && python -m xiaozhi_eval.metrics --output ../evals/generated-release && python smoke.py ../../python-eval/test-results/packaged-http)
          (cd release/ml-intent && python -m pytest -q && python experiment.py --output runs/release-validation)
          mkdir -p release/evals/ml-intent/release-validation
          for file in REPORT.md metrics.json test-predictions.csv report.html; do cp "release/ml-intent/runs/release-validation/$file" release/evals/ml-intent/release-validation/; done
          rm -rf release/ml-intent/runs
          for cache in __pycache__ .pytest_cache; do find release -type d -name "$cache" -prune -exec rm -rf {} +; done
          printf '%s\n' "$(git rev-parse HEAD)" > release/COMMIT.txt
          python3 scripts/check-release.py --jar release/xiaozhi.jar --dist xiaozhi-ui/dist --release-dir release
          (cd release && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd release && zip -qr ../xiaozhi-${GITHUB_REF_NAME}.zip .)
          sha256sum xiaozhi-${GITHUB_REF_NAME}.zip > xiaozhi-${GITHUB_REF_NAME}.zip.sha256
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "xiaozhi-${GITHUB_REF_NAME}.zip" "xiaozhi-${GITHUB_REF_NAME}.zip.sha256" "xiaozhi-ui/test-results/demo/xiaozhi-ui-demo.webm" "xiaozhi-ui/test-results/demo/demo.json" --verify-tag --title "小智 AI 工程演示 $GITHUB_REF_NAME" --notes-file docs/AI_RELEASE_NOTES.md