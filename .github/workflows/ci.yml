name: Project checks

on:
  push:
    branches: [main, "integration/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend rules, sources, accounts and MySQL transactions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      XIAOZHI_TEST_MYSQL_USER: root
      XIAOZHI_TEST_MYSQL_PASSWORD: ci-test-only
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-test-only
          MYSQL_ROOT_HOST: '%'
        ports:
          - 13307:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pci-test-only"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Test and package backend (isolated MySQL and Mongo, no cloud keys)
        run: mvn -B -ntp -f backend/pom.xml -Dxiaozhi.auth.integration=true -Dxiaozhi.mysql.integration=true verify
      - name: Ensure database and main streaming suites really ran
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          suites = [('security.AccountIsolationTest', 1), ('service.AppointmentMySqlIntegrationTest', 19),
                    ('controller.ChatControllerStreamTest', 27), ('security.AccountSecurityConfigTest', 2),
                    ('config.DashScopeNetworkConfigTest', 3), ('config.ModelErrorSummaryTest', 5),
                    ('config.DashScopeIdleTimeoutTest', 1), ('eval.RetrievalEvalTest', 10), ('context.ContextEngineeringTest', 7),
                    ('service.HybridKnowledgeTest', 7), ('observability.TracingTest', 3), ('observability.OtlpExportTest', 4),
                    ('service.AgentMultiTurnContractTest', 8), ('service.AgentMultiTurnGraderTest', 8),
                    ('service.AppointmentToolFailureTest', 10), ('service.AppointmentQueryContextTest', 7),
                    ('service.StagedAppointmentModelsTest', 19)]
          for suite, minimum in suites:
              report = ET.parse(f'backend/target/surefire-reports/TEST-com.ruomu.xiaozhi.{suite}.xml').getroot()
              assert int(report.attrib['tests']) >= minimum, f'{suite}: tests missing'
              for key in ('failures', 'errors', 'skipped'):
                  assert int(report.attrib.get(key, 0)) == 0, f'{suite}: {key} must be zero'
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/agent-multiturn/
          if-no-files-found: warn
          retention-days: 7

  framework-examples:
    name: Example / ${{ matrix.example }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        example: [aiservice-comparison, pinecone-comparison, flux-comparison]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: examples/${{ matrix.example }}/pom.xml
      - run: mvn -B -ntp -f examples/${{ matrix.example }}/pom.xml verify
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: tests-${{ matrix.example }}
          path: examples/${{ matrix.example }}/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7

  frontend-build:
    name: Vue tests and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: xiaozhi-ui
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: xiaozhi-ui/package-lock.json
      - run: npm ci
      - run: npm run test:ci
      - name: Install browser for transport and mobile interaction checks
        run: npx playwright install --with-deps chromium
      - name: Check browser recovery and confirmation flows (controlled HTTP backend)
        run: npm run test:browser
      - name: Audit frontend dependencies (runtime and development)
        run: npm audit --json --audit-level=low > test-results/npm-audit.json
      - name: Test read-only MCP protocol and dependency audit
        working-directory: mcp
        run: npm ci --ignore-scripts && npm test && npm audit --audit-level=low
      - run: npm run build
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Check executable JAR includes the production Vue page
        working-directory: .
        run: |
          mvn -B -ntp -f backend/pom.xml -Prelease-ui -DskipTests package
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('backend/target/backend-1.0-SNAPSHOT.jar') as jar:
              names = jar.namelist()
              assert 'BOOT-INF/classes/static/index.html' in names
              assert any(n.startswith('BOOT-INF/classes/static/assets/') and n.endswith('.js') for n in names)
              assert 'BOOT-INF/classes/static/demo.html' not in names
          PY
      - name: Check backup drill JavaScript syntax
        working-directory: .
        run: node --check scripts/backup-restore-probe.mjs
      - name: Parse Windows release and backup scripts
        working-directory: .
        shell: pwsh
        run: |
          foreach ($file in @('scripts/build-release.ps1', 'deploy/start.ps1', 'scripts/test-backup-restore.ps1', 'scripts/test-ai-retrieval.ps1', 'scripts/test-mysql.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw "PowerShell parse failed: $file" }
          }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: frontend-test-reports
          path: xiaozhi-ui/test-results/
          if-no-files-found: warn
          retention-days: 7